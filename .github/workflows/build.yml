name: myos-builder
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"

  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-runtime-artifacts:
    name: Validate runtime artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check runtime scripts, templates, and units
        run: |
          set -euo pipefail
          bash ./scripts/validate-runtime-artifacts.sh

  validate-alma9-nvidia-legacy:
    name: Validate Alma 9 NVIDIA Legacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Alma 9 NVIDIA legacy stream
        shell: pwsh
        run: ./scripts/verify-alma9-nvidia-legacy.ps1
  full-core-images:
    name: Full Core Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-alma9-nvidia-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-full-alma9
            recipe: /images/core/alma9/full.yml
          - name: core-full-alma9-nvidia-open
            recipe: /images/core/alma9/full-nvidia-open.yml
          - name: core-full-alma9-nvidia-legacy
            recipe: /images/core/alma9/full-nvidia-legacy.yml
          - name: core-full-alma10
            recipe: /images/core/alma10/full.yml
          - name: core-full-alma10-nvidia-open
            recipe: /images/core/alma10/full-nvidia-open.yml
    steps:
      - name: Build full core image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  gnome-images:
    name: GNOME Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-alma9-nvidia-legacy
      - full-core-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gnome-alma9
            recipe: /images/gnome/alma9/gnome.yml
          - name: gnome-alma9-nvidia-open
            recipe: /images/gnome/alma9/nvidia-open.yml
          - name: gnome-alma9-nvidia-legacy
            recipe: /images/gnome/alma9/nvidia-legacy.yml
          - name: gnome-alma10
            recipe: /images/gnome/alma10/gnome.yml
          - name: gnome-alma10-nvidia-open
            recipe: /images/gnome/alma10/nvidia-open.yml
    steps:
      - name: Build GNOME image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  cosmic-images:
    name: COSMIC Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-alma9-nvidia-legacy
      - full-core-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cosmic-alma9
            recipe: /images/cosmic/alma9/cosmic.yml
          - name: cosmic-alma9-nvidia-open
            recipe: /images/cosmic/alma9/nvidia-open.yml
          - name: cosmic-alma9-nvidia-legacy
            recipe: /images/cosmic/alma9/nvidia-legacy.yml
          - name: cosmic-alma10
            recipe: /images/cosmic/alma10/cosmic.yml
          - name: cosmic-alma10-nvidia-open
            recipe: /images/cosmic/alma10/nvidia-open.yml
    steps:
      - name: Build COSMIC image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true
