name: myos-builder
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"

  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-tenant-cli:
    name: Validate tenant CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tenant scripts and templates
        run: |
          set -euo pipefail
          find files/agent/platform-host/usr/local/libexec/myos -type f -print0 | xargs -0 -n1 bash -n
          bash -n files/agent/platform-host/etc/myos/templates/openclaw/scripts/openclaw-start.sh
          node --check files/agent/platform-host/etc/myos/templates/openclaw/scripts/openclaw-ui-server.mjs
          python3 -m json.tool files/agent/platform-host/etc/myos/templates/openclaw/config/openclaw.json.example >/dev/null
          grep -q "import '/usr/share/myos/just/rebase.just'" files/justfiles/usr/share/myos/just/index.just
          grep -q "import '/usr/share/myos/just/tenant.just'" files/agent/justfiles/usr/share/myos/just/index.just
          grep -q '^tenant-list ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-dashboard ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-config ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-models ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-openclaw ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-optimize-tokens ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-tailscale ' files/agent/justfiles/usr/share/myos/just/tenant.just

  minimal-core-images:
    name: Minimal Core Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - /images/core/alma9/minimal.yml
          - /images/core/alma9/minimal-nvidia.yml
          - /images/core/alma10/minimal.yml
          - /images/core/alma10/minimal-nvidia.yml
    steps:
      - name: Build minimal core image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  full-core-images:
    name: Full Core Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - /images/core/alma9/full.yml
          - /images/core/alma9/full-nvidia.yml
          - /images/core/alma10/full.yml
          - /images/core/alma10/full-nvidia.yml
    steps:
      - name: Build full core image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  workstation-images:
    name: Workstation Images
    needs:
      - full-core-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - /images/workstation/alma9/workstation.yml
          - /images/workstation/alma9/nvidia.yml
          - /images/workstation/alma10/workstation.yml
          - /images/workstation/alma10/nvidia.yml
    steps:
      - name: Build workstation image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true
