name: myos-builder
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-tenant-cli:
    name: Validate tenant CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tenant scripts and templates
        run: |
          set -euo pipefail
          find files/platform-host/usr/local/libexec/myos -type f -print0 | xargs -0 -n1 bash -n
          bash -n files/platform-host/etc/myos/templates/openclaw/scripts/openclaw-start.sh
          node --check files/platform-host/etc/myos/templates/openclaw/scripts/openclaw-ui-server.mjs
          python3 -m json.tool files/platform-host/etc/myos/templates/openclaw/config/openclaw.json.example >/dev/null
          grep -q "import '/usr/share/myos/just/tenant.just'" files/justfiles/usr/share/myos/just/index.just
          grep -q '^tenant-dashboard ' files/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-config ' files/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-models ' files/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-openclaw ' files/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-optimize-tokens ' files/justfiles/usr/share/myos/just/tenant.just

  alma10:
    name: Alma 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - /RHEL/alma10/alma10.yml
          - /RHEL/alma10/alma10-nvidia.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Alma 10
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  alma9:
    name: Alma 9
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - /RHEL/alma9/alma9.yml
          - /RHEL/alma9/alma9-nvidia.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Alma 9
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  fedora:
    name: Fedora 42
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - /fedora/fedora42.yml
          - /fedora/fedora42-nvidia.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Fedora 42
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true
