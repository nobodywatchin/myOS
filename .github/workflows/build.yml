name: myos-builder
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-runtime-artifacts:
    name: Validate runtime artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check runtime scripts, templates, and units
        run: |
          set -euo pipefail
          bash ./scripts/validate-runtime-artifacts.sh

  validate-image-matrix:
    name: Validate image matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check supported and unsupported recipe combinations
        run: |
          set -euo pipefail
          bash ./scripts/validate-image-matrix.sh

  validate-alma9-nvidia-legacy:
    name: Validate Alma 9 NVIDIA Legacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Alma 9 NVIDIA legacy stream
        shell: pwsh
        run: ./scripts/verify-alma9-nvidia-legacy.ps1

  server-images:
    name: Server Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-full-alma9
            recipe: /images/server/alma9/full.yml
          - name: core-full-alma9-nvidia-open
            recipe: /images/server/alma9/full-nvidia-open.yml
          - name: core-full-alma9-nvidia-legacy
            recipe: /images/server/alma9/full-nvidia-legacy.yml
          - name: core-full-alma10
            recipe: /images/server/alma10/full.yml
          - name: core-full-alma10-nvidia-open
            recipe: /images/server/alma10/full-nvidia-open.yml
    steps:
      - name: Build Server image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  workstation-core-images:
    name: Workstation Core Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workstation-core-gnome-alma9
            recipe: /images/workstation/gnome/alma9/core.yml
          - name: workstation-core-gnome-alma9-nvidia-open
            recipe: /images/workstation/gnome/alma9/core-nvidia-open.yml
          - name: workstation-core-gnome-alma9-nvidia-legacy
            recipe: /images/workstation/gnome/alma9/core-nvidia-legacy.yml
          - name: workstation-core-gnome-alma10
            recipe: /images/workstation/gnome/alma10/core.yml
          - name: workstation-core-gnome-alma10-nvidia-open
            recipe: /images/workstation/gnome/alma10/core-nvidia-open.yml
          - name: workstation-core-cosmic-alma9
            recipe: /images/workstation/cosmic/alma9/core.yml
          - name: workstation-core-cosmic-alma9-nvidia-open
            recipe: /images/workstation/cosmic/alma9/core-nvidia-open.yml
          - name: workstation-core-cosmic-alma9-nvidia-legacy
            recipe: /images/workstation/cosmic/alma9/core-nvidia-legacy.yml
          - name: workstation-core-cosmic-alma10
            recipe: /images/workstation/cosmic/alma10/core.yml
          - name: workstation-core-cosmic-alma10-nvidia-open
            recipe: /images/workstation/cosmic/alma10/core-nvidia-open.yml
    steps:
      - name: Build core Workstation image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  workstation-full-images:
    name: Workstation Full Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-legacy
      - server-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gnome-alma9
            recipe: /images/workstation/gnome/alma9/full.yml
          - name: gnome-alma9-nvidia-open
            recipe: /images/workstation/gnome/alma9/full-nvidia-open.yml
          - name: gnome-alma9-nvidia-legacy
            recipe: /images/workstation/gnome/alma9/full-nvidia-legacy.yml
          - name: gnome-alma10
            recipe: /images/workstation/gnome/alma10/full.yml
          - name: gnome-alma10-nvidia-open
            recipe: /images/workstation/gnome/alma10/full-nvidia-open.yml
          - name: cosmic-alma9
            recipe: /images/workstation/cosmic/alma9/full.yml
          - name: cosmic-alma9-nvidia-open
            recipe: /images/workstation/cosmic/alma9/full-nvidia-open.yml
          - name: cosmic-alma9-nvidia-legacy
            recipe: /images/workstation/cosmic/alma9/full-nvidia-legacy.yml
          - name: cosmic-alma10
            recipe: /images/workstation/cosmic/alma10/full.yml
          - name: cosmic-alma10-nvidia-open
            recipe: /images/workstation/cosmic/alma10/full-nvidia-open.yml
    steps:
      - name: Build full Workstation image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  console-images:
    name: Console Images (${{ matrix.name }})
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console-core-alma10
            recipe: /images/console/alma10/core.yml
          - name: console-core-alma10-nvidia-open
            recipe: /images/console/alma10/core-nvidia-open.yml
    steps:
      - name: Build Console image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true
