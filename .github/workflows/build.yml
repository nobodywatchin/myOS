name: myos-builder
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"

  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-tenant-cli:
    name: Validate tenant CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tenant scripts and templates
        run: |
          set -euo pipefail
          find files/agent/platform-host/usr/local/libexec/myos -type f -print0 | xargs -0 -n1 bash -n
          bash -n files/agent/platform-host/usr/local/bin/openquad
          bash -n files/agent/platform-host/etc/myos/templates/apps/openclaw/scripts/openclaw-start.sh
          node --check files/agent/platform-host/etc/myos/templates/apps/openclaw/scripts/openclaw-ui-server.mjs
          python3 -m json.tool files/agent/platform-host/etc/myos/templates/apps/openclaw/config/openclaw.json.example >/dev/null
          grep -q "import '/usr/share/myos/just/rebase.just'" files/justfiles/usr/share/myos/just/index.just
          grep -q "import '/usr/share/myos/just/tenant.just'" files/agent/justfiles/usr/share/myos/just/index.just
          grep -q "import '/usr/share/myos/just/openclaw-host.just'" files/agent/justfiles/usr/share/myos/just/index.just
          grep -q '^tenant-list ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-dashboard ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-config ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-models ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-openclaw ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-optimize-tokens ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^tenant-tailscale ' files/agent/justfiles/usr/share/myos/just/tenant.just
          grep -q '^openclaw-host ' files/agent/justfiles/usr/share/myos/just/openclaw-host.just
          bash -n modules/os-release-meta/os-release-meta.sh

  validate-alma9-nvidia-legacy:
    name: Validate Alma 9 NVIDIA Legacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Alma 9 NVIDIA legacy stream
        shell: pwsh
        run: ./scripts/verify-alma9-nvidia-legacy.ps1
  full-core-images:
    name: Full Core Images (${{ matrix.name }})
    needs:
      - validate-tenant-cli
      - validate-alma9-nvidia-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-full-alma9
            recipe: /images/core/alma9/full.yml
          - name: core-full-alma9-nvidia-open
            recipe: /images/core/alma9/full-nvidia-open.yml
          - name: core-full-alma9-nvidia-legacy
            recipe: /images/core/alma9/full-nvidia-legacy.yml
          - name: core-full-alma10
            recipe: /images/core/alma10/full.yml
          - name: core-full-alma10-nvidia-open
            recipe: /images/core/alma10/full-nvidia-open.yml
    steps:
      - name: Build full core image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true

  workstation-images:
    name: Workstation Images (${{ matrix.name }})
    needs:
      - validate-tenant-cli
      - validate-alma9-nvidia-legacy
      - full-core-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workstation-alma9
            recipe: /images/workstation/alma9/workstation.yml
          - name: workstation-alma9-nvidia-open
            recipe: /images/workstation/alma9/nvidia-open.yml
          - name: workstation-alma9-nvidia-legacy
            recipe: /images/workstation/alma9/nvidia-legacy.yml
          - name: workstation-alma10
            recipe: /images/workstation/alma10/workstation.yml
          - name: workstation-alma10-nvidia-open
            recipe: /images/workstation/alma10/nvidia-open.yml
    steps:
      - name: Build workstation image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          rechunk: true
          maximize_build_space: true
