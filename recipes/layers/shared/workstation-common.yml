modules:
  # Shared workstation orchestrator used by every workstation image.
  #
  # Keep this file small. Put package groups and policy in explicit sublayers so
  # workstation opinions remain visible instead of accumulating in one file.
  #
  # Expected order:
  # - shared Flatpak base is included by the image recipe before this layer
  # - distro-specific workstation drift comes after this layer
  # - DE-specific session logic comes from workstation-gnome.yml or
  #   workstation-cosmic.yml later in the image recipe
  - from-file: layers/shared/workstation-substrate.yml

  - type: files
    files:
      - source: workstation/shared
        destination: /

  - from-file: layers/shared/workstation-admin-tools.yml
  - from-file: layers/shared/workstation-policy.yml
  - from-file: layers/shared/workstation-user-tools.yml
