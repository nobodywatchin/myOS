---
modules:
  # Shared end-user baseline for Workstation images.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - flatpak

  - type: files
    files:
      - source: end-user/shared
        destination: /

  - type: containerfile
    snippets:
      - RUN rm -f /usr/share/flatpak/remotes.d/*.flatpakrepo || true
      - RUN rm -f /etc/flatpak/remotes.d/*.flatpakrepo || true
