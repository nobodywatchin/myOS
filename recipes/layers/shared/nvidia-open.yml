---
modules:
  - from-file: layers/shared/nvidia-common.yml

  - type: containerfile
    snippets:
      - RUN test -x /var/run/rpm-kmod-nvidia-open-modules || (mkdir -p /run && printf '#!/bin/sh\nexit 0\n' > /run/rpm-kmod-nvidia-open-modules && chmod 0755 /run/rpm-kmod-nvidia-open-modules)

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nvidia-open-kmod
        - nvidia-driver
        - nvidia-driver-cuda
        - cuda-toolkit
