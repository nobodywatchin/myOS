modules:
  # Cross-distro core tools layered after shared/core-base.yml and any
  # distro-family repository setup required to make these packages available.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - gcc
        - zstd
        - fastfetch
        - fzf
        - distrobox
        - podman-compose

  - from-file: layers/features/cockpit.yml

  - type: containerfile
    snippets:
      - RUN install -d -m 0755 /etc/myos
      - RUN restorecon -RF /etc/myos || true

  - from-file: layers/features/ceph.yml
