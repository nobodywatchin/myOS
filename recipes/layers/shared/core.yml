modules:
  # Alma-specific delta layered on top of the shared cross-distro core baseline.
  - from-file: layers/shared/core-base.yml

  - type: dnf
    install:
      packages:
        - epel-release

  - type: containerfile
    snippets:
      - RUN dnf -y config-manager --set-enabled crb

  - type: dnf
    remove:
      packages:
        - subscription-manager
    install:
      install-weak-deps: false
      packages:
        - dnf
        - gcc
        - zstd
        - fastfetch
        - fzf
        - distrobox
        - podman-compose