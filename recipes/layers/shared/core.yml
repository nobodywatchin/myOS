---
modules:
  # Shared core substrate used by every myOS image.
  #
  # This is the boring stable base: common EL identity, container/runtime
  # tooling, user-owned local AI/runtime support, shared ROCm userspace, update
  # policy, and image branding. Role-specific end-user or host/operator surface
  # is layered later.
  - type: os-release-meta
    source: local

  - type: dnf
    install:
      packages:
        - epel-release

  - type: containerfile
    snippets:
      - RUN dnf -y config-manager --set-enabled crb

  - type: dnf
    remove:
      packages:
        - subscription-manager
    install:
      install-weak-deps: false
      packages:
        - gcc
        - zstd
        - lshw
        - dnf-plugins-core
        - audit
        - rpm-plugin-audit
        - basesystem
        - bash
        - coreutils
        - crypto-policies
        - crypto-policies-scripts
        - dnf
        - e2fsprogs
        - filesystem
        - glibc
        - ca-certificates
        - hostname
        - irqbalance
        - kbd
        - less
        - ncurses
        - policycoreutils
        - procps-ng
        - rootfiles
        - rpm
        - selinux-policy-targeted
        - setup
        - shadow-utils
        - sudo
        - systemd
        - systemd-udev
        - util-linux
        - xfsprogs
        - curl
        - iproute
        - iputils
        - NetworkManager
        - openssh-server
        - p11-kit
        - chrony
        - dosfstools
        - lvm2
        - sg3_utils
        - sg3_utils-libs
        - dbus
        - python3-libselinux
        - linux-firmware
        - system-reinstall-bootc
        - fastfetch
        - fzf
        - NetworkManager-tui
        - podman
        - podman-docker
        - podman-compose
        - container-selinux
        - conntrack-tools
        - skopeo
        - buildah
        - distrobox
        - fuse-overlayfs
        - mesa-vulkan-drivers
        - slirp4netns
        - openssh-clients
        - policycoreutils-python-utils
        - vim-minimal
        - vulkan-loader
        - vulkan-tools
        - bzip2
        - file
        - gnupg2
        - mailcap
        - rsync
        - tar
        - unzip
        - wget
        - which
        - zip

  - type: containerfile
    snippets:
      - >-
        RUN for helper in distrobox-export distrobox-host-exec distrobox-init; do \
          if [ -x "/usr/bin/${helper}" ] && [ ! -e "/usr/sbin/${helper}" ]; then \
            ln -s "../bin/${helper}" "/usr/sbin/${helper}"; \
          fi; \
        done

  - type: files
    files:
      - source: base/runtime
        destination: /
      - source: justfiles
        destination: /
      - source: agent/runtime-core/etc
        destination: /etc
      - source: agent/runtime-core/usr
        destination: /usr
      - source: base/branding
        destination: /

  # ROCm and host Vulkan stay in core by design so every image keeps the same
  # local GPU/runtime baseline without forcing hosted tooling, model services,
  # or NVIDIA-specific choices.
  - type: dnf
    repos:
      files:
        - rocm.repo
      keys:
        - https://repo.radeon.com/rocm/rocm.gpg.key
    install:
      install-weak-deps: false
      skip-broken: true
      packages:
        - clinfo
        - repo: rocm
          packages:
            - amd-smi-lib
            - rocminfo
            - rocm-hip-sdk
            - rocm-ml-sdk
            - rocm-opencl-sdk
            - rocm-smi-lib

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          getent group video >/dev/null 2>&1 || groupadd --system video; \
          getent group render >/dev/null 2>&1 || groupadd --system render; \
          ldconfig

  # Tailscale stays part of the shared base for both workstation and advanced
  # host flows, but the desktop systray remains a GNOME-only session helper.
  - type: containerfile
    snippets:
      - RUN . /usr/share/myos/os-release-meta.env && dnf config-manager --add-repo "https://pkgs.tailscale.com/stable/rhel/${EL_MAJOR}/tailscale.repo"
      - RUN dnf config-manager --set-disabled "tailscale-stable"
      - RUN dnf -y --enablerepo "tailscale-stable" install tailscale

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: kargs
    kargs:
      - iommu=pt
      - transparent_hugepage=madvise
      - radeon.si_support=0
      - amdgpu.si_support=1
      - radeon.cik_support=0
      - amdgpu.cik_support=1

  - type: systemd
    system:
      masked:
        - rpm-ostree-countme.service
        - rpm-ostree-countme.timer
        - akmods-keygen@akmods-keygen.service
        - bootc-fetch-apply-updates.service
        - bootc-fetch-apply-updates.timer

  - type: os-release
    properties:
      NAME: myOS
      PRETTY_NAME: myOS
      VENDOR_NAME: myOS
