---
modules:
  # Shared COSMIC workstation layer. The package source stays shared, but the
  # COPR target string is EL-major aware because COPR names the EL9 and EL10
  # chroots differently. COSMIC prefers the packaged cosmic-greeter service,
  # which wraps greetd with the upstream COSMIC config, so this layer validates
  # both the desktop session pieces and the greetd-side integration files.
  - type: files
    files:
      - source: cosmic/shared
        destination: /

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          . /usr/share/myos/os-release-meta.env; \
          arch="$(uname -m)"; \
          case "$EL_MAJOR" in \
            9) copr_target="epel-9-${arch}" ;; \
            10) copr_target="rhel+epel-10-${arch}" ;; \
            *) echo "Unsupported EL major for COSMIC: $EL_MAJOR" >&2; exit 1 ;; \
          esac; \
          dnf -y copr enable "ligenix/enterprise-cosmic" "$copr_target"
      - >-
        RUN set -eux; \
          optional_packages=""; \
          if dnf -q repoquery cosmic-config-fedora >/dev/null 2>&1; then \
            optional_packages="$optional_packages cosmic-config-fedora"; \
          fi; \
          if dnf -q repoquery cosmic-desktop >/dev/null 2>&1; then \
            dnf -y --setopt=install_weak_deps=False install \
              cosmic-desktop \
              cosmic-greeter \
              greetd \
              gnome-keyring \
              gnome-keyring-pam \
              xdg-desktop-portal-cosmic \
              adw-gtk3-theme \
              $optional_packages; \
          else \
            dnf -y --setopt=install_weak_deps=False install \
              cosmic-session \
              cosmic-comp \
              cosmic-panel \
              cosmic-app-library \
              cosmic-applets \
              cosmic-files \
              cosmic-launcher \
              cosmic-notifications \
              cosmic-osd \
              cosmic-settings \
              cosmic-settings-daemon \
              cosmic-store \
              cosmic-term \
              cosmic-workspaces \
              cosmic-randr \
              cosmic-screenshot \
              cosmic-bg \
              cosmic-wallpapers \
              cosmic-icon-theme \
              cosmic-initial-setup \
              cosmic-greeter \
              greetd \
              gnome-keyring \
              gnome-keyring-pam \
              xdg-desktop-portal-cosmic \
              adw-gtk3-theme \
              $optional_packages; \
          fi; \
          command -v cosmic-session >/dev/null; \
          command -v cosmic-panel >/dev/null; \
          command -v cosmic-app-library >/dev/null; \
          command -v cosmic-files >/dev/null; \
          command -v cosmic-settings >/dev/null; \
          command -v cosmic-store >/dev/null; \
          command -v cosmic-greeter-start >/dev/null; \
          command -v cosmic-greeter-daemon >/dev/null; \
          command -v gnome-keyring-daemon >/dev/null; \
          find /usr/share/wayland-sessions -maxdepth 1 -type f -iname '*cosmic*.desktop' | grep -q .; \
          test -f /usr/lib/systemd/system/cosmic-greeter.service; \
          test -f /usr/lib/systemd/system/greetd.service; \
          test -f /etc/greetd/cosmic-greeter.toml; \
          test -f /etc/pam.d/cosmic-greeter; \
          find /usr/lib /usr/lib64 -path '*/security/pam_gnome_keyring.so' -type f | grep -q .; \
          grep -q 'command = "cosmic-greeter-start"' /etc/greetd/cosmic-greeter.toml
