modules:
  # Shared NVIDIA repo/bootstrap wiring reused by every NVIDIA image lane.
  - type: files
    files:
      - source: nvidia/usr
        destination: /usr

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - pcp-pmda-nvidia-gpu

  - type: containerfile
    snippets:
      - RUN curl -fsSL https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo -o /etc/yum.repos.d/nvidia-container-toolkit.repo
      # NVIDIA has recently served repo metadata signatures that DNF rejects for this repo.
      # Keep RPM package GPG checking enabled, but disable repo metadata GPG checking so
      # later unrelated DNF transactions do not fail before package resolution.
      - RUN sed -i -e 's/^repo_gpgcheck=.*/repo_gpgcheck=0/' -e 's/^gpgcheck=.*/gpgcheck=1/' /etc/yum.repos.d/nvidia-container-toolkit.repo && if ! grep -q '^repo_gpgcheck=' /etc/yum.repos.d/nvidia-container-toolkit.repo; then printf '\nrepo_gpgcheck=0\n' >> /etc/yum.repos.d/nvidia-container-toolkit.repo; fi && if ! grep -q '^gpgcheck=' /etc/yum.repos.d/nvidia-container-toolkit.repo; then printf 'gpgcheck=1\n' >> /etc/yum.repos.d/nvidia-container-toolkit.repo; fi
      - RUN dnf -y --enablerepo "nvidia-container-toolkit" install nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
      - RUN chmod 0755 /usr/local/libexec/current/current-pcp-nvidia-pmda-apply
      - RUN ldconfig

  - type: systemd
    system:
      enabled:
        - current-pcp-nvidia-pmda-apply.service

  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
