modules:
  # Shared NVIDIA repo/bootstrap wiring reused by every NVIDIA image lane.
  - type: files
    files:
      - source: nvidia/usr
        destination: /usr

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - pcp-pmda-nvidia-gpu

  - type: containerfile
    snippets:
      - RUN curl -fsSL https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo -o /etc/yum.repos.d/nvidia-container-toolkit.repo
      # NVIDIA occasionally ships bad or mismatched repomd.xml signatures for this repo.
      # Keep RPM package GPG checks enabled, but do not make every later dnf transaction
      # depend on repo metadata signature verification for the container toolkit repo.
      - RUN sed -i 's/^repo_gpgcheck=.*/repo_gpgcheck=0/' /etc/yum.repos.d/nvidia-container-toolkit.repo && grep -q '^gpgcheck=1' /etc/yum.repos.d/nvidia-container-toolkit.repo
      - RUN dnf -y --enablerepo "nvidia-container-toolkit" install nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
      - RUN chmod 0755 /usr/local/libexec/myos/myos-pcp-nvidia-pmda-apply
      - RUN ldconfig

  - type: systemd
    system:
      enabled:
        - myos-pcp-nvidia-pmda-apply.service

  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
