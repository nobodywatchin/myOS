---
modules:
  # Shared full-core substrate for every `core-full-*` image.
  # Keep distro-specific additions in `recipes/layers/alma9/core.yml` and
  # `recipes/layers/alma10/core.yml`.
  #
  # 1) EL identity and repo bootstrap
  - type: os-release-meta
    source: local

  - type: dnf
    install:
      packages:
        - epel-release

  - type: containerfile
    snippets:
      - RUN dnf -y config-manager --set-enabled crb

  # 2) Shared base system and container/runtime tools
  - type: dnf
    remove:
      packages:
        - subscription-manager
    install:
      install-weak-deps: false
      packages:
        - lshw
        - dnf-plugins-core
        - audit
        - rpm-plugin-audit
        - basesystem
        - bash
        - coreutils
        - crypto-policies
        - crypto-policies-scripts
        - dnf
        - e2fsprogs
        - filesystem
        - glibc
        - ca-certificates
        - hostname
        - irqbalance
        - kbd
        - less
        - ncurses
        - policycoreutils
        - procps-ng
        - rootfiles
        - rpm
        - selinux-policy-targeted
        - setup
        - shadow-utils
        - sudo
        - systemd
        - systemd-udev
        - util-linux
        - xfsprogs
        - curl
        - iproute
        - iputils
        - NetworkManager
        - openssh-server
        - p11-kit
        - chrony
        - dosfstools
        - lvm2
        - sg3_utils
        - sg3_utils-libs
        - dbus
        - python3-libselinux
        - linux-firmware
        - system-reinstall-bootc
        - fastfetch
        - fzf
        - NetworkManager-tui
        - podman
        - podman-docker
        - podman-compose
        - container-selinux
        - conntrack-tools
        - skopeo
        - buildah
        - distrobox
        - fuse-overlayfs
        - slirp4netns
        - openssh-clients
        - policycoreutils-python-utils
        - vim-minimal
        - bzip2
        - file
        - gnupg2
        - mailcap
        - rsync
        - tar
        - unzip
        - wget
        - which
        - zip
  - type: containerfile
    snippets:
      - >-
        RUN for helper in distrobox-export distrobox-host-exec distrobox-init; do \
          if [ -x "/usr/bin/${helper}" ] && [ ! -e "/usr/sbin/${helper}" ]; then \
            ln -s "../bin/${helper}" "/usr/sbin/${helper}"; \
          fi; \
        done

  # 3) Shared external repos and baseline services
  - type: containerfile
    snippets:
      - RUN . /usr/share/myos/os-release-meta.env && dnf config-manager --add-repo "https://pkgs.tailscale.com/stable/rhel/${EL_MAJOR}/tailscale.repo"
      - RUN dnf config-manager --set-disabled "tailscale-stable"
      - RUN dnf -y --enablerepo "tailscale-stable" install tailscale

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  # 4) Shared runtime payloads and operator entrypoints
  - type: files
    files:
      - source: base/runtime
        destination: /
      - source: justfiles
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - gcc
        - zstd
        - cockpit
        - cockpit-ostree
        - cockpit-files
        - cockpit-storaged
        - cockpit-podman

  - type: files
    files:
      - source: agent/platform-host/etc
        destination: /etc
      - source: agent/platform-host/usr
        destination: /usr
      - source: agent/platform-host/var
        destination: /var
      - source: agent/justfiles
        destination: /

  # 5) Shared platform-host layout and model service account
  - type: containerfile
    snippets:
      - >-
        RUN getent passwd modelsvc >/dev/null 2>&1 || useradd --system \
          --create-home --home-dir /var/lib/modelsvc --shell /usr/sbin/nologin \
          --comment "myOS shared model service" modelsvc

      # Managed platform layout under /etc, /srv, and /var/tmp for shared host tooling.
      - >-
        RUN install -d -m 0755 \
          /etc/myos /etc/myos/dns /etc/myos/firewall \
          /etc/myos/firewall/rendered /etc/myos/firewall/tenants \
          /etc/myos/persistent-users /etc/myos/persistent-users/users \
          /etc/myos/proxy /etc/myos/proxy/tenants \
          /etc/myos/ramalama /etc/myos/ramalama/models \
          /etc/myos/templates /etc/myos/templates/apps \
          /etc/myos/templates/apps/openclaw \
          /etc/myos/templates/persistent-users \
          /etc/myos/templates/persistent-users/baseline \
          /etc/myos/templates/persistent-users/baseline/quadlets \
          /etc/myos/templates/persistent-users/owner \
          /etc/myos/templates/persistent-users/owner/quadlets \
          /etc/myos/tenants \
          /srv/models /srv/models/ramalama \
          /srv/tenants /srv/tenants/.skel \
          /var/tmp/myos-podman

      - RUN install -D -m 0644 /var/srv/tenants/README.md /srv/tenants/.skel/README.md

      - >-
        RUN install -d -m 0755 \
          /usr/local/libexec/myos \
          /var/lib/modelsvc/.config \
          /var/lib/modelsvc/.local/share

      - RUN ln -sfn /srv/models/ramalama /var/lib/modelsvc/.local/share/ramalama

      # Reserve subordinate IDs so the shared model service can use rootless Podman safely.
      - >-
        RUN if ! grep -q '^modelsvc:' /etc/subuid; then \
          start="$(awk -F: 'BEGIN{max=200000} NF >= 3 && $2 ~ /^[0-9]+$/ && \
            $3 ~ /^[0-9]+$/ {end=$2+$3; if (end > max) max=end} END{print max+1}' \
            /etc/subuid 2>/dev/null)"; \
          printf 'modelsvc:%s:65536\n' "${start:-200001}" >> /etc/subuid; \
        fi

      - >-
        RUN if ! grep -q '^modelsvc:' /etc/subgid; then \
          start="$(awk -F: 'BEGIN{max=200000} NF >= 3 && $2 ~ /^[0-9]+$/ && \
            $3 ~ /^[0-9]+$/ {end=$2+$3; if (end > max) max=end} END{print max+1}' \
            /etc/subgid 2>/dev/null)"; \
          printf 'modelsvc:%s:65536\n' "${start:-200001}" >> /etc/subgid; \
        fi

      - RUN chown -R modelsvc:modelsvc /var/lib/modelsvc /srv/models/ramalama

      # Pre-label persistent content so shared rootless services come up with the right SELinux context.
      - RUN semanage fcontext -a -t container_file_t '/srv/models(/.*)?' 2>/dev/null || true
      - RUN semanage fcontext -a -t container_file_t '/srv/tenants(/.*)?' 2>/dev/null || true
      - RUN semanage fcontext -a -e /var/lib/containers /var/tmp/myos-podman 2>/dev/null || true

      - >-
        RUN restorecon -RF \
          /etc/myos /srv/models /srv/tenants \
          /usr/local/libexec/myos \
          /usr/lib/systemd/system/myos-ramalama@.service \
          /etc/nginx/conf.d/myos-platform.conf \
          /var/lib/modelsvc \
          /var/tmp/myos-podman || true

  # 6) Shared accelerator userspace for AI-capable images
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - mesa-vulkan-drivers
        - vulkan-loader
        - vulkan-tools

  - type: dnf
    repos:
      files:
        - rocm.repo
      keys:
        - https://repo.radeon.com/rocm/rocm.gpg.key
    install:
      install-weak-deps: false
      skip-broken: true
      packages:
        - clinfo
        - repo: rocm
          packages:
            - amd-smi-lib
            - rocminfo
            - rocm-hip-sdk
            - rocm-ml-sdk
            - rocm-opencl-sdk
            - rocm-smi-lib

  - type: dnf
    repos:
      files:
        - opentofu.repo
      keys:
        - https://packages.opentofu.org/opentofu/tofu/gpgkey
        - https://get.opentofu.org/opentofu.asc
    install:
      install-weak-deps: false
      packages:
        - repo: opentofu
          packages:
            - tofu

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          getent group video >/dev/null 2>&1 || groupadd --system video; \
          getent group render >/dev/null 2>&1 || groupadd --system render; \
          ldconfig

  # 7) Shared boot arguments across the full image family
  - type: kargs
    kargs:
      - iommu=pt
      - transparent_hugepage=madvise
      - radeon.si_support=0
      - amdgpu.si_support=1
      - radeon.cik_support=0
      - amdgpu.cik_support=1

  # 8) Final service defaults and image branding
  - type: systemd
    system:
      masked:
        - rpm-ostree-countme.service
        - rpm-ostree-countme.timer
        - akmods-keygen@akmods-keygen.service
        - bootc-fetch-apply-updates.service
        - bootc-fetch-apply-updates.timer
      disabled:
        - myos-ramalama@default.service

  - type: files
    files:
      - source: base/branding
        destination: /

  - type: os-release
    properties:
      NAME: myOS
      PRETTY_NAME: myOS
      VENDOR_NAME: myOS
