---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - ethtool
        - iproute-tc
        - dracut-network
        - mtr
        - tcpdump
        - traceroute
        - iptables
        - socat
        - cryptsetup
        - mdadm
        - quota
        - rdma-core
        - nvmetcli
        - blktrace
        - bpftool
        - tuned
        - nvme-cli
        - cifs-utils
        - nfs-utils
        - rsyslog
        - lsof
        - sos
        - smartmontools
        - strace
        - rasdaemon
        - time
        - parted
        - kernel-tools
        - firewalld
        - flatseal
        - gnome-calculator

  - type: containerfile
    snippets:
      - RUN rm -f /usr/share/flatpak/remotes.d/*.flatpakrepo || true
      - RUN rm -f /etc/flatpak/remotes.d/*.flatpakrepo || true
      - >-
        RUN install -d -m 0755 \
          /etc/skel/.config/containers/systemd \
          /etc/skel/.config/systemd/user/graphical-session.target.wants
      - >-
        RUN ln -sfn ../../../containers/systemd/openclaw-watchdog.service \
          /etc/skel/.config/systemd/user/graphical-session.target.wants/openclaw-watchdog.service

  - type: default-flatpaks
    configurations:
      - scope: user
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub (user)
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - com.github.marhkb.Pods
          - io.github.dvlv.boxbuddyrs
          - io.github.giantpinkrobots.flatsweep
          - it.mijorus.gearlever
          - com.usebottles.bottles
          - net.nokyan.Resources
          - com.mattjakeman.ExtensionManager
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - org.gnome.Epiphany
          - org.gnome.Decibels
          - org.gnome.Showtime
          - org.gnome.FileRoller
          - org.gnome.Firmware

  - type: files
    files:
      - source: workstation/flatpak
        destination: /
      - source: agent/quadlets
        destination: /etc/skel/.config/containers/systemd

  - type: systemd
    system:
      enabled:
        - flatpak-hide-org-system.service
