modules:
  # Fedora R580 userspace extras must be installed while Negativo17's R580
  # repository is enabled. The base driver layer removes that repo after its
  # verified build, so this workstation-only layer restores it just for this
  # transaction and removes it again afterward.
  - type: containerfile
    snippets:
      - >-
        RUN /usr/bin/bash -euxo pipefail -c '
        curl -fLsS --retry 5
        -o /etc/yum.repos.d/fedora-nvidia-580.repo
        https://negativo17.org/repos/fedora-nvidia-580.repo;
        dnf -y --setopt=install_weak_deps=False
        --enablerepo=fedora-nvidia-580
        install libnvidia-cfg libnvidia-fbc nvidia-libXNVCtrl nvidia-settings;
        rm -f /etc/yum.repos.d/fedora-nvidia-580.repo;
        ldconfig
        '

  - type: kargs
    kargs:
      - nvidia-drm.modeset=1
      - nvidia-drm.fbdev=1
