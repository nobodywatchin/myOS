---
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - jreilly1821/c10s-gnome
    install:
      install-weak-deps: false
      packages:
        - acl
        - almalinux-release
        - alsa-sof-firmware
        - attr
        - bash-completion
        - bc
        - bind-utils
        - cpio
        - crontabs
        - cyrus-sasl-plain
        - dos2unix
        - git
        - glibc-all-langpacks
        - hunspell
        - ibus-anthy
        - ibus-gtk3
        - ibus-hangul
        - ibus-libpinyin
        - ibus-libzhuyin
        - ibus-m17n
        - ibus-typing-booster
        - logrotate
        - lrzsz
        - man-pages
        - mcelog
        - microcode_ctl
        - net-tools
        - nmap-ncat
        - pciutils
        - pinentry-gnome3
        - plymouth
        - plymouth-plugin-script
        - polkit
        - qt6-qtbase
        - qt6-qtbase-gui
        - qt6-qtdeclarative
        - realmd
        - setroubleshoot
        - sssd
        - symlinks
        - telnet
        - thermald
        - tree
        - usbutils
        - words
        - bash-color-prompt
        - usbmuxd
        - libimobiledevice
        - libimobiledevice-utils
        - libimobiledevice-glue
        - libusbmuxd
        - libusbmuxd-utils
        - libplist
        - ifuse
        - libmtp
        - libgphoto2
        - jetbrains-mono-fonts-all
        - google-noto-sans-cjk-fonts
        - bluez-cups
        - hidapi
        - brcmfmac-firmware
        - atheros-firmware
        - tiwilink-firmware
        - realtek-firmware
        - nxpwireless-firmware
        - mt7xxx-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - iwlegacy-firmware
        - libertas-firmware
        - gvfs
        - powertop
        - tuned-ppd
        - libcamera-v4l2
        - gnome-text-editor
        - loupe
        - ptyxis
        - baobab
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:jreilly1821:c10s-gnome
        packages:
          - glib2
          - gdm
          - gnome-shell
          - gnome-control-center
          - gnome-settings-daemon
          - gnome-session
          - gnome-initial-setup
          - gnome-remote-desktop
          - xdg-desktop-portal
          - xdg-desktop-portal-gnome

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - org.gnome.Logs

  - type: gnome-extensions
    install:
      - 3843
      - 615
      - 517
      - 7
      - 6139
      - 3193
      - 7065
      - 7535
      - 19
      - 779
      - 1460
      - 6580
      - 1401
      - 6051
      - 8243

  - type: kargs
    kargs:
      - mem_sleep_default=s2idle
      - amdgpu.si_support=1
      - amdgpu.cik_support=1
      - radeon.si_support=0
      - radeon.cik_support=0
      - modprobe.blacklist=radeon
