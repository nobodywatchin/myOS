---
modules:
  - type: dnf
    repos:
      keys:
        - https://download1.rpmfusion.org/free/el/RPM-GPG-KEY-rpmfusion-free-el-10
        - https://download1.rpmfusion.org/nonfree/el/RPM-GPG-KEY-rpmfusion-nonfree-el-10
    install:
      packages:
        - https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-10.noarch.rpm
        - https://mirrors.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-10.noarch.rpm

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - akmods
        - akmod-wl
        - broadcom-wl
        - kernel-headers
        - make
        - binutils
        - elfutils-libelf-devel
        - bc
        - patch
        - wpa_supplicant
        - rfkill
        - iw
        - mokutil
        - perl

  - type: files
    files:
      - source: workstation/wl
        destination: /

  - type: containerfile
    snippets:
      - RUN chmod 0755 /usr/local/sbin/wl-akmods-build.sh
      - RUN chmod 0755 /usr/local/sbin/needs-wl.sh
      - RUN install -d -m 0755 /var/lib/wl-kmods
      - RUN semanage fcontext -a -t modules_object_t '/var/lib/wl-kmods(/.*)?'
      - RUN restorecon -Rv /var/lib/wl-kmods
      - RUN rm -f /etc/yum.repos.d/rpmfusion-*.repo

  - type: systemd
    system:
      enabled:
        - wl-akmods-load.service

  - type: dnf
    repos:
      cleanup: true
      copr:
        - jreilly1821/c10s-gnome
        - trixieua/morewaita-icon-theme
    remove:
      packages:
        - vim-minimal
    install:
      install-weak-deps: false
      packages:
        - acl
        - almalinux-release
        - alsa-sof-firmware
        - attr
        - bash-completion
        - bc
        - bind-utils
        - cpio
        - crontabs
        - cyrus-sasl-plain
        - dos2unix
        - git
        - glibc-all-langpacks
        - hunspell
        - ibus-anthy
        - ibus-gtk3
        - ibus-hangul
        - ibus-libpinyin
        - ibus-libzhuyin
        - ibus-m17n
        - ibus-typing-booster
        - logrotate
        - lrzsz
        - man-pages
        - mcelog
        - microcode_ctl
        - net-tools
        - nmap-ncat
        - pciutils
        - pinentry-gnome3
        - plymouth
        - plymouth-system-theme
        - plymouth-plugin-script
        - polkit
        - qt6-qtbase
        - qt6-qtbase-gui
        - qt6-qtdeclarative
        - realmd
        - setroubleshoot
        - sssd
        - symlinks
        - telnet
        - thermald
        - tree
        - usbutils
        - words
        - bash-color-prompt
        - vim-enhanced
        - usbmuxd
        - libimobiledevice
        - libimobiledevice-utils
        - libimobiledevice-glue
        - libusbmuxd
        - libusbmuxd-utils
        - libplist
        - ifuse
        - libmtp
        - libgphoto2
        - morewaita-icon-theme
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - pipewire-jack-audio-connection-kit
        - pipewire-utils
        - wireplumber
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-free-libs
        - alsa-ucm
        - alsa-utils
        - pavucontrol
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        - dejavu-serif-fonts
        - jetbrains-mono-fonts-all
        - google-noto-sans-arabic-fonts
        - google-noto-sans-hebrew-fonts
        - google-noto-sans-devanagari-fonts
        - google-noto-sans-cjk-fonts
        - cups
        - cups-pk-helper
        - cups-filters
        - ghostscript
        - gutenprint
        - gutenprint-cups
        - system-config-printer-udev
        - hplip
        - libsane-hpaio
        - sane-backends-drivers-scanners
        - sane-airscan
        - NetworkManager-wifi
        - NetworkManager-bluetooth
        - NetworkManager-wwan
        - NetworkManager-adsl
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - dnsmasq
        - nftables
        - ModemManager
