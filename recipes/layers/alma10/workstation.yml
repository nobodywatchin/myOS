---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - acl
        - almalinux-release
        - alsa-sof-firmware
        - attr
        - bash-completion
        - bc
        - bind-utils
        - cpio
        - crontabs
        - cyrus-sasl-plain
        - dos2unix
        - git
        - glibc-all-langpacks
        - hunspell
        - ibus-anthy
        - ibus-gtk3
        - ibus-hangul
        - ibus-libpinyin
        - ibus-libzhuyin
        - ibus-m17n
        - ibus-typing-booster
        - logrotate
        - man-pages
        - microcode_ctl
        - nmap-ncat
        - pciutils
        - pinentry-gnome3
        - plymouth
        - plymouth-plugin-script
        - polkit
        - qt6-qtbase
        - qt6-qtbase-gui
        - qt6-qtdeclarative
        - realmd
        - setroubleshoot
        - sssd
        - thermald
        - tree
        - usbutils
        - bash-color-prompt
        - usbmuxd
        - libimobiledevice
        - libimobiledevice-utils
        - libimobiledevice-glue
        - libusbmuxd
        - libusbmuxd-utils
        - libplist
        - ifuse
        - libmtp
        - libgphoto2
        - jetbrains-mono-fonts-all
        - google-noto-sans-cjk-fonts
        - bluez-cups
        - hidapi
        - brcmfmac-firmware
        - atheros-firmware
        - tiwilink-firmware
        - realtek-firmware
        - nxpwireless-firmware
        - mt7xxx-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - iwlegacy-firmware
        - libertas-firmware
        - gvfs
        - powertop
        - tuned-ppd
        - libcamera-v4l2
        - xorg-x11-xinit
        - gnome-text-editor
        - loupe
        - ptyxis
        - baobab

  - type: gnome-extensions
    install:
      - 7535 # Accent Icons
      - 6051 # Quick Web Search

  - type: files
    files:
      - source: workstation/gnome-alma10
        destination: /

  - type: kargs
    kargs:
      - mem_sleep_default=s2idle
      - amdgpu.si_support=1
      - amdgpu.cik_support=1
      - radeon.si_support=0
      - radeon.cik_support=0
      - modprobe.blacklist=radeon
