        - gdm
        - gnome-shell
        - gnome-control-center
        - gnome-settings-daemon
        - gnome-session
        - gnome-initial-setup
        - gnome-remote-desktop
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - gnome-software
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:jreilly1821:c10s-gnome
        packages:
          - glib2
          - gdm
          - gnome-shell
          - gnome-control-center
          - gnome-settings-daemon
          - gnome-session
          - gnome-initial-setup
          - gnome-remote-desktop
          - xdg-desktop-portal
          - xdg-desktop-portal-gnome

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - org.gnome.Logs

  - type: gnome-extensions
    install:
      - 3843
      - 615
      - 517
      - 7
      - 6139
      - 3193
      - 7065
      - 7535
      - 19
      - 779
      - 1460
      - 6580
      - 1401
      - 6051
      - 8243

  - type: files
    files:
      - source: workstation/gnome
        destination: /

  - type: bling
    install:
      - dconf-update-service

  - type: kargs
    kargs:
      - mem_sleep_default=s2idle
      - amdgpu.si_support=1
      - amdgpu.cik_support=1
      - radeon.si_support=0
      - radeon.cik_support=0
      - modprobe.blacklist=radeon