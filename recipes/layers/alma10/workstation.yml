        - gvfs-goa
        - gvfs-gphoto2
        - gvfs-mtp
        - gvfs-smb
        - fwupd
        - bolt
        - switcheroo-control
        - powertop
        - tuned-ppd
        - libcamera
        - libcamera-v4l2
        - libcamera-gstreamer
        - libcamera-tools
        - wl-clipboard
        - flatpak
        - systemd-oomd
        - systemd-container
        - gnome-color-manager
        - gnome-disk-utility
