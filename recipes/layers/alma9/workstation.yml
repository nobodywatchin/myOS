---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - acl
        - almalinux-release
        - alsa-sof-firmware
        - attr
        - bash-completion
        - cpio
        - crontabs
        - cyrus-sasl-plain
        - dos2unix
        - git
        - glibc-all-langpacks
        - google-noto-cjk-fonts-common
        - google-noto-fonts-common
        - gnome-logs
        - gnome-shell-extension-sound-output-device-chooser
        - gnome-shell-extension-workspace-indicator
        - hunspell
        - ibus-anthy
        - ibus-gtk3
        - ibus-hangul
        - ibus-libpinyin
        - ibus-libzhuyin
        - ibus-m17n
        - ibus-typing-booster
        - logrotate
        - microcode_ctl
        - pciutils
        - pinentry-gnome3
        - plymouth
        - polkit
        - setroubleshoot
        - thermald
        - usbutils
        - xorg-x11-utils

  - type: containerfile
    snippets:
      - >-
        # Alma 9 GNOME 40 still needs this tiny workspace-indicator tweak so the
        # indicator lands on the left side of the top bar instead of the default
        # position used by the packaged extension.
        RUN ext=/usr/share/gnome-shell/extensions/workspace-indicator@gnome-shell-extensions.gcampax.github.com; \
          js="$ext/extension.js"; \
          grep -q "addToStatusArea('workspace-indicator', _indicator, 0, 'left')" "$js" || \
          sed -i "s/Main\\.panel\\.addToStatusArea('workspace-indicator', _indicator);/Main.panel.addToStatusArea('workspace-indicator', _indicator, 0, 'left');/" "$js"

  # Alma 9 currently carries two known GNOME extension rough edges:
  # - clipboard-indicator
  # - bluetooth-quick-connect
  # Their packaged schemas are still the ones that fail here, so leave the
  # extensions enabled/configured through dconf for now but do not keep the old
  # build-time glib-compile-schemas workaround in the image recipe.

  # Append Alma 9-specific system Flatpaks on top of the shared workstation
  # defaults from `shared/workstation-base.yml`; `default-flatpaks`
  # configurations add to the shared list instead of replacing it.
  - type: gnome-extensions
    install:
      - 3184  # No Activities Button

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - app.devsuite.Ptyxis

  - type: files
    files:
      - source: workstation/gnome-alma9
        destination: /
