---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - acl
        - almalinux-release
        - alsa-sof-firmware
        - attr
        - bash-completion
        - cpio
        - crontabs
        - cyrus-sasl-plain
        - dos2unix
        - git
        - glibc-all-langpacks
        - google-noto-cjk-fonts-common
        - google-noto-fonts-common
        - gnome-logs
        - gnome-shell-extension-sound-output-device-chooser
        - hunspell
        - ibus-anthy
        - ibus-gtk3
        - ibus-hangul
        - ibus-libpinyin
        - ibus-libzhuyin
        - ibus-m17n
        - ibus-typing-booster
        - logrotate
        - microcode_ctl
        - pciutils
        - pinentry-gnome3
        - plymouth
        - polkit
        - setroubleshoot
        - thermald
        - usbutils
        - xorg-x11-utils

  - type: containerfile
    snippets:
      - RUN curl -fsSL https://repo.secureblue.dev/secureblue.repo -o /etc/yum.repos.d/secureblue.repo
      - RUN dnf config-manager --set-disabled "secureblue"
      - RUN dnf -y --enablerepo "secureblue" install trivalent

  - type: containerfile
    snippets:
      - >-
        RUN for ext in \
          /usr/share/gnome-shell/extensions/clipboard-indicator@tudmotu.com \
          /usr/share/gnome-shell/extensions/bluetooth-quick-connect@bjarosze.gmail.com; do \
            if [ -d "$ext/schemas" ]; then \
              glib-compile-schemas "$ext/schemas"; \
            fi; \
          done

  # Append Alma 9-specific system Flatpaks on top of the shared workstation
  # defaults from `shared/workstation-base.yml`; `default-flatpaks`
  # configurations add to the shared list instead of replacing it.
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - app.devsuite.Ptyxis

  - type: files
    files:
      - source: workstation/gnome-alma9
        destination: /
