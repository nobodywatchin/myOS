---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - gnome-logs
        - gnome-shell-extension-sound-output-device-chooser
        - gnome-shell-extension-workspace-indicator
        - gnome-tweaks

  # These packaged schemas are still the ones that fail here:
  # - clipboard-indicator
  # - bluetooth-quick-connect
  # Alma 9 GNOME 40 has a boring activities button, so it's disabled and replaced with a Workspace Indicator
  - type: gnome-extensions
    install:
      - 3184  # No Activities Button

  # indicator lands on the left side of the top bar instead of the default position used by the packaged extension.
  - type: containerfile
    snippets:
      - RUN ext=/usr/share/gnome-shell/extensions/workspace-indicator@gnome-shell-extensions.gcampax.github.com; js="$ext/extension.js"; grep -q "addToStatusArea('workspace-indicator', _indicator, 0, 'left')" "$js" || sed -i "s/Main\\.panel\\.addToStatusArea('workspace-indicator', _indicator);/Main.panel.addToStatusArea('workspace-indicator', _indicator, 0, 'left');/" "$js"

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: org-system
          title: Flathub (system, managed)
        install:
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - app.devsuite.Ptyxis

  # Alma 9 GNOME-only dconf overrides live under `gnome/alma9/`
  - type: files
    files:
      - source: gnome/alma9
        destination: /
