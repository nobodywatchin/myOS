---
modules:
  # Shared Tailscale package and daemon baseline. Enrollment and policy stay
  # runtime/admin choices above the image.
  - type: containerfile
    snippets:
      - >-
        RUN set -eux;
        . /usr/share/myos/os-release-meta.env;
        if [ "${EL_FAMILY}" = "true" ]; then
        repo_url="https://pkgs.tailscale.com/stable/rhel/${EL_MAJOR}/tailscale.repo";
        else
        repo_url="https://pkgs.tailscale.com/stable/fedora/tailscale.repo";
        fi;
        curl -fsSL "${repo_url}" -o /etc/yum.repos.d/tailscale.repo;
        sed -i 's/^enabled=1$/enabled=0/' /etc/yum.repos.d/tailscale.repo;
        dnf -y --enablerepo tailscale-stable install tailscale

  - type: systemd
    system:
      enabled:
        - tailscaled.service
