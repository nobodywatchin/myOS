---
modules:
  # Alma/RHEL-family repository setup required before shared/core.yml installs
  # common core tools that come from EPEL/CRB on EL-derived images.
  - type: dnf
    install:
      packages:
        - epel-release

  - type: containerfile
    snippets:
      - RUN dnf -y config-manager --set-enabled crb

  - type: dnf
    remove:
      packages:
        - subscription-manager
    install:
      install-weak-deps: false
      packages:
        - dnf

  - type: dnf
    repos:
      files:
        - opentofu.repo
      keys:
        - https://packages.opentofu.org/opentofu/tofu/gpgkey
        - https://get.opentofu.org/opentofu.asc
    install:
      install-weak-deps: false
      packages:
        - repo: opentofu
          packages:
            - tofu

  - type: containerfile
    snippets:
      - |
        RUN set -eux; \
            HELM_VERSION="v4.2.0"; \
            ARCH="$(uname -m)"; \
            case "$ARCH" in \
              x86_64) HELM_ARCH="amd64" ;; \
              aarch64) HELM_ARCH="arm64" ;; \
              *) echo "unsupported arch: $ARCH" >&2; exit 1 ;; \
            esac; \
            HELM_TARBALL="helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"; \
            curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}"; \
            curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}.sha256sum"; \
            sha256sum -c "${HELM_TARBALL}.sha256sum"; \
            tar -xzf "${HELM_TARBALL}"; \
            install -m 0755 "linux-${HELM_ARCH}/helm" /usr/bin/helm; \
            rm -rf "linux-${HELM_ARCH}" "${HELM_TARBALL}" "${HELM_TARBALL}.sha256sum"; \
            helm version
