---
modules:
  # Fedora 43 counterpart to the shared core substrate used by the Alma lanes.
  # It keeps the same role contract, but switches the distro-specific repo and
  # package assumptions away from EPEL/CRB and the EL-only ROCm/Tailscale setup.
  - type: os-release-meta
    source: local

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - lshw
        - dnf-plugins-core
        - dnf5-plugins
        - audit
        - rpm-plugin-audit
        - basesystem
        - bash
        - coreutils
        - crypto-policies
        - crypto-policies-scripts
        - e2fsprogs
        - filesystem
        - glibc
        - ca-certificates
        - hostname
        - irqbalance
        - just
        - kbd
        - less
        - ncurses
        - plocate
        - policycoreutils
        - procps-ng
        - rootfiles
        - rpm
        - selinux-policy-targeted
        - setup
        - shadow-utils
        - sudo
        - systemd
        - systemd-udev
        - util-linux
        - xfsprogs
        - curl
        - iproute
        - iputils
        - NetworkManager
        - openssh-server
        - p11-kit
        - chrony
        - dosfstools
        - lvm2
        - sg3_utils
        - sg3_utils-libs
        - dbus
        - python3-libselinux
        - linux-firmware
        - system-reinstall-bootc
        - fastfetch
        - fzf
        - NetworkManager-tui
        - podman
        - podman-docker
        - podman-compose
        - container-selinux
        - conntrack-tools
        - skopeo
        - buildah
        - distrobox
        - fuse-overlayfs
        - mesa-vulkan-drivers
        - slirp4netns
        - openssh-clients
        - policycoreutils-python-utils
        - vim-minimal
        - vulkan-loader
        - vulkan-tools
        - bzip2
        - file
        - gnupg2
        - mailcap
        - rsync
        - tar
        - unzip
        - wget
        - which
        - zip

  - type: containerfile
    snippets:
      - >-
        RUN for helper in distrobox-export distrobox-host-exec distrobox-init; do \
          if [ -x "/usr/bin/${helper}" ] && [ ! -e "/usr/sbin/${helper}" ]; then \
            ln -s "../bin/${helper}" "/usr/sbin/${helper}"; \
          fi; \
        done

  - type: files
    files:
      - source: base/runtime
        destination: /
      - source: justfiles
        destination: /
      - source: agent/runtime-core/etc
        destination: /etc
      - source: agent/runtime-core/usr
        destination: /usr
      - source: base/branding
        destination: /

  # Fedora ships ROCm packages directly, so the Fedora lane keeps the same
  # userspace intent without carrying the EL-only vendor repo file.
  - type: dnf
    install:
      install-weak-deps: false
      skip-broken: true
      packages:
        - clinfo
        - rocminfo
        - rocm-hip-devel
        - rocm-opencl-devel
        - rocm-smi

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          getent group video >/dev/null 2>&1 || groupadd --system video; \
          getent group render >/dev/null 2>&1 || groupadd --system render; \
          ldconfig

  # Keep the Tailscale repo disabled by default, matching the Alma build-time
  # pattern while switching to the Fedora-specific upstream repo definition.
  - type: containerfile
    snippets:
      - >-
        RUN curl -fsSL https://pkgs.tailscale.com/stable/fedora/tailscale.repo \
          -o /etc/yum.repos.d/tailscale.repo && \
          sed -i 's/^enabled=1$/enabled=0/' /etc/yum.repos.d/tailscale.repo && \
          dnf -y --enablerepo tailscale-stable install tailscale

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: kargs
    kargs:
      - iommu=pt
      - transparent_hugepage=madvise
      - radeon.si_support=0
      - amdgpu.si_support=1
      - radeon.cik_support=0
      - amdgpu.cik_support=1

  - type: systemd
    system:
      masked:
        - rpm-ostree-countme.service
        - rpm-ostree-countme.timer
        - akmods-keygen@akmods-keygen.service
        - bootc-fetch-apply-updates.service
        - bootc-fetch-apply-updates.timer

  - type: os-release
    properties:
      NAME: myOS
      PRETTY_NAME: myOS
      VENDOR_NAME: myOS
