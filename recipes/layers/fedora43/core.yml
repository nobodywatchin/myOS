modules:
  # Fedora 43 delta layered on top of the shared cross-distro core baseline.
  - from-file: layers/shared/core-base.yml

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - dnf5-plugins
        - just
        - plocate

  # Fedora ships ROCm packages directly, so this lane keeps the same userspace
  # intent without carrying the EL-only vendor repo file.
  - type: dnf
    install:
      install-weak-deps: false
      skip-broken: true
      packages:
        - clinfo
        - rocminfo
        - rocm-hip-devel
        - rocm-opencl-devel
        - rocm-smi
        - gcc
