modules:
  # Fedora 43 uses NVIDIA's Fedora CUDA repo directly instead of the AlmaLinux
  # NVIDIA release package, but the shared repo bootstrap and kernel args still
  # belong in the common NVIDIA layers.
  - from-file: layers/shared/nvidia-base.yml
  - from-file: layers/shared/nvidia-open-common.yml

  - type: containerfile
    snippets:
      - >-
        RUN curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/fedora43/$(uname -m)/cuda-fedora43.repo           -o /etc/yum.repos.d/cuda.repo &&           dnf config-manager --set-disabled "cuda-fedora43-x86_64"
      - >-
        RUN dnf -y --setopt=install_weak_deps=False --enablerepo "cuda-fedora43-x86_64" install           kmod-nvidia-open-dkms nvidia-open nvidia-driver           nvidia-driver-cuda cuda-toolkit
