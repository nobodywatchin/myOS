---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nginx

  - type: files
    files:
      - source: platform-host
        destination: /

  - type: containerfile
    snippets:
      - RUN getent passwd modelsvc >/dev/null 2>&1 || useradd --system --create-home --home-dir /var/lib/modelsvc --shell /usr/sbin/nologin --comment "myOS shared model service" modelsvc
      - RUN install -d -m 0755 /etc/myos /etc/myos/dns /etc/myos/firewall /etc/myos/firewall/rendered /etc/myos/firewall/tenants /etc/myos/proxy /etc/myos/proxy/tenants /etc/myos/ramalama /etc/myos/ramalama/models /etc/myos/templates /etc/myos/templates/openclaw /etc/myos/tenants /srv/models /srv/models/ramalama /srv/tenants /srv/tenants/.skel
      - RUN install -d -m 0755 /usr/local/libexec/myos /var/lib/modelsvc/.config /var/lib/modelsvc/.local/share
      - RUN ln -sfn /srv/models/ramalama /var/lib/modelsvc/.local/share/ramalama
      - RUN if ! grep -q '^modelsvc:' /etc/subuid; then start="$(awk -F: 'BEGIN{max=200000} NF >= 3 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {end=$2+$3; if (end > max) max=end} END{print max+1}' /etc/subuid 2>/dev/null)"; printf 'modelsvc:%s:65536\n' "${start:-200001}" >> /etc/subuid; fi
      - RUN if ! grep -q '^modelsvc:' /etc/subgid; then start="$(awk -F: 'BEGIN{max=200000} NF >= 3 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {end=$2+$3; if (end > max) max=end} END{print max+1}' /etc/subgid 2>/dev/null)"; printf 'modelsvc:%s:65536\n' "${start:-200001}" >> /etc/subgid; fi
      - RUN chown -R modelsvc:modelsvc /var/lib/modelsvc /srv/models/ramalama
      - RUN chmod 0755 /usr/local/libexec/myos/*
      - RUN chmod 0644 /usr/lib/systemd/system/myos-ramalama@.service /etc/nginx/conf.d/myos-platform.conf
      - RUN semanage fcontext -a -t container_file_t '/srv/models(/.*)?' 2>/dev/null || true
      - RUN semanage fcontext -a -t container_file_t '/srv/tenants(/.*)?' 2>/dev/null || true
      - RUN restorecon -RF /etc/myos /srv/models /srv/tenants /usr/local/libexec/myos /usr/lib/systemd/system/myos-ramalama@.service /etc/nginx/conf.d/myos-platform.conf /var/lib/modelsvc || true

  - type: systemd
    system:
      disabled:
        - nginx.service
        - myos-ramalama@default.service
