---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: gnome-alma10-nvidia-open
description: myOS AlmaLinux 10 GNOME image layered on the published full NVIDIA open core image with GNOME NVIDIA extras.
base-image: ghcr.io/myos-dev/core-full-alma10-nvidia-open
# This tracks the latest published build of our own Alma 10 NVIDIA core line,
# not Alma's quay tag semantics.
image-version: latest
modules:
  - from-file: layers/shared/gnome-base.yml
  - from-file: layers/alma10/gnome.yml
  - from-file: layers/shared/nvidia-gnome.yml
  - type: initramfs
  - type: signing
