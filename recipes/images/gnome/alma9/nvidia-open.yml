---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: gnome-alma9-nvidia-open
description: myOS AlmaLinux 9 GNOME image layered on the published full NVIDIA open core image with GNOME NVIDIA extras.
base-image: ghcr.io/myos-dev/core-full-alma9-nvidia-open
# GNOME images intentionally track the latest published build of the
# matching myOS core line rather than rebuilding the full stack inline.
image-version: latest
modules:
  - from-file: layers/shared/gnome-base.yml
  - from-file: layers/alma9/gnome.yml
  - from-file: layers/shared/nvidia-gnome.yml
  - type: initramfs
  - type: signing
