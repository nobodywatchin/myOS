---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-alma10-nvidia-open
description: myOS AlmaLinux 10 COSMIC image layered on the published full NVIDIA open core image with workstation NVIDIA extras.
base-image: ghcr.io/myos-dev/core-full-alma10-nvidia-open
# This tracks the latest published build of our own Alma 10 NVIDIA core line,
# not Alma's quay tag semantics.
image-version: latest
modules:
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma10/workstation.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - type: initramfs
  - type: signing
