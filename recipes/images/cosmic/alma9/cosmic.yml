---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-alma9
description: myOS AlmaLinux 9 COSMIC image layered on the published full core image.
base-image: ghcr.io/myos-dev/core-full-alma9
# COSMIC images intentionally track the latest published build of the
# matching myOS core line rather than rebuilding the full stack inline.
image-version: latest
modules:
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - type: initramfs
  - type: signing
