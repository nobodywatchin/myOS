---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: core-full-alma10-nvidia-open
description: Full myOS AlmaLinux 10 core with RamaLama, tenant tooling, shared admin services, and NVIDIA open kernel modules.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: 10
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/alma10/core.yml
  - from-file: layers/shared/core-full.yml
  - from-file: layers/alma10/core-full.yml
  - from-file: layers/shared/nvidia-open.yml
  - type: initramfs
  - type: signing
