---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: core-full-alma9-nvidia-legacy
description: Full myOS AlmaLinux 9 core for older-GPU AI hosts with tenant tooling, shared admin services, and pinned proprietary NVIDIA 580 prebuilt kernel modules.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: latest
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/alma9/core.yml
  - from-file: layers/alma9/nvidia-legacy.yml
  - type: initramfs
  - type: signing
