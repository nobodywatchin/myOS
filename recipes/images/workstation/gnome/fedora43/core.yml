---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: workstation-core-gnome-fedora43
description: myOS Fedora 43 core Workstation image with the GNOME family and no default host/operator tooling.
base-image: quay.io/fedora/fedora-bootc
image-version: 43
modules:
  - from-file: layers/fedora43/core.yml
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/fedora43/workstation.yml
  - from-file: layers/shared/workstation-gnome.yml
  - from-file: layers/fedora43/gnome.yml
  - type: initramfs
  - type: signing
