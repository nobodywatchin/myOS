---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: gnome-alma10-nvidia-open
description: myOS AlmaLinux 10 full Workstation (GNOME family) on the published full NVIDIA open Server base with workstation NVIDIA extras.
base-image: ghcr.io/myos-dev/core-full-alma10-nvidia-open
image-version: latest
modules:
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma10/workstation.yml
  - from-file: layers/shared/workstation-gnome.yml
  - from-file: layers/alma10/gnome.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - type: initramfs
  - type: signing
