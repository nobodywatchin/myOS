---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: gnome-alma10
description: myOS AlmaLinux 10 full Workstation (GNOME family) layered on the published full Server image for compatibility.
base-image: ghcr.io/myos-dev/core-full-alma10
image-version: latest
modules:
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma10/workstation.yml
  - from-file: layers/shared/workstation-gnome.yml
  - from-file: layers/alma10/gnome.yml
  - type: initramfs
  - type: signing
