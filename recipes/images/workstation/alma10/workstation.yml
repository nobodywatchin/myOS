---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: workstation-alma10
description: myOS AlmaLinux 10 workstation layered on the published full core image.
base-image: ghcr.io/myos-dev/core-full-alma10
# This tracks the latest published build of our own Alma 10 core image line,
# not Alma's quay tag semantics.
image-version: latest
modules:
  - from-file: layers/shared/gnome-base.yml
  - from-file: layers/alma10/workstation.yml
  - type: initramfs
  - type: signing
