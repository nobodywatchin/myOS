---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: workstation-core-cosmic-alma9-nvidia-legacy
description: myOS AlmaLinux 9 core Workstation image with the COSMIC family and the proprietary NVIDIA 580 older-GPU AI lane.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: latest
modules:
  - from-file: layers/shared/core.yml
  - from-file: layers/alma9/core.yml
  - from-file: layers/alma9/nvidia-legacy.yml
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - type: initramfs
  - type: signing
