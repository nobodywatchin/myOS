# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-alma9
description: myOS AlmaLinux 9 full Workstation (COSMIC family) layered on the published full Server image for compatibility.
base-image: ghcr.io/myos-dev/core-full-alma9
image-version: latest
modules:
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - type: initramfs
  - type: signing
