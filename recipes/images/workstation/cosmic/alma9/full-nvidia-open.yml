---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-alma9-nvidia-open
description: myOS AlmaLinux 9 full Workstation (COSMIC family) on the published full NVIDIA open Server base with workstation NVIDIA extras.
base-image: ghcr.io/myos-dev/core-full-alma9-nvidia-open
image-version: latest
modules:
  - from-file: layers/shared/end-user-common.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - type: initramfs
  - type: signing
