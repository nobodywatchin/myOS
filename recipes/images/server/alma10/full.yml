---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: alma10-server
description: myOS AlmaLinux 10 stable server image with admin/operator tooling and optional per-user OpenClaw support.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: 10
modules:
  - from-file: layers/shared/core.yml
  - from-file: layers/alma10/core.yml
  - from-file: layers/shared/full.yml
  - from-file: layers/alma10/full.yml
  - type: initramfs
  - type: signing
