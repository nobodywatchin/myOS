---
modules:
  - type: dnf
    install:
      packages:
        - libnvidia-fbc
        - libnvidia-cfg
        - nvidia-settings
        - nvidia-libXNVCtrl
        - nvidia-libXNVCtrl-devel
  
  - type: containerfile
    snippets:
      - RUN curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | tee /etc/yum.repos.d/nvidia-container-toolkit.repo
      - RUN dnf config-manager --set-disabled nvidia-container-toolkit
      - RUN dnf -y --enablerepo="nvidia-container-toolkit" install nvidia-container-toolkit 
  
  - type: files
    files:
      - source: nvidia 
        destination: /
  
  - type: containerfile
    snippets:
      - RUN chmod 0755 /usr/local/sbin/nvidia-akmods-build.sh
      - RUN chmod 0755 /usr/local/sbin/nvidia-cdi-ensure.sh
  
  - type: systemd
    system:
      enabled:
      - nvidia-akmods-load.service
      - nvidia-cdi-ensure.service

  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1