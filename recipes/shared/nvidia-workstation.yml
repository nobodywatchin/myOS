---
modules:
  - type: dnf
    install:
      packages:
        - libnvidia-fbc
        - libnvidia-cfg
        - nvidia-settings
        - nvidia-libXNVCtrl
        - nvidia-libXNVCtrl-devel
        
  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1