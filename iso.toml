[customizations.iso]
volume_id = "CURRENT-ALMA10"
application_id = "Current Alma 10 Server Installer"
publisher = "Current"

[customizations.installer.kickstart]
contents = """
# --- Locale & input (safe defaults) ---
lang en_US.UTF-8
keyboard us

# Use the installer UI and let it prompt (timezone, storage, users, etc.)
graphical

# Network is safe to pre-enable. Do not configure firewall here unless
# firewalld exists in the installed payload image.
network --bootproto=dhcp --device=link --activate --onboot=on

# Lock root; create your admin user manually in the installer UI.
rootpw --lock

# Reboot after install.
reboot

# --- Post-install tweaks ---
%post --erroronfail
echo current > /etc/hostname
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Network",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
