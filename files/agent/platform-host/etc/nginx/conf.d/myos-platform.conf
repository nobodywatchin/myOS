# myOS OpenClaw platform routing scaffold.
#
# nginx is shipped as a substrate only. This server stays loopback-only until
# an operator promotes reviewed tenant route fragments from
# /etc/myos/proxy/tenants/*.conf.example to *.conf.

server {
    listen 127.0.0.1:8088 default_server;
    server_name _;

    access_log /var/log/nginx/myos-platform.access.log combined;
    error_log /var/log/nginx/myos-platform.error.log warn;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 404 "No tenant route has been activated on this host.\n";
    }
}

include /etc/myos/proxy/tenants/*.conf;
