[Service]
# Keep the managed system remote hidden from app/source enumeration after BlueBuild
# refreshes system Flatpak state, but leave it usable for automatic runtime deps.
ExecStartPost=-/usr/bin/bash -lc '/usr/bin/flatpak --system remotes --columns=name | /usr/bin/grep -qx org-system && /usr/bin/flatpak --system remote-modify --no-enumerate --use-for-deps org-system'
