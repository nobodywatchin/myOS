# TuneD writes these state files under /etc at runtime. Ensure they get the
# policy-defined writable labels on bootc deployments and after rebases.
z /etc/tuned/active_profile - - - -
z /etc/tuned/profile_mode - - - -
z /etc/tuned/post_loaded_profile - - - -
z /etc/tuned/bootcmdline - - - -
z /etc/tuned/ppd_base_profile - - - -

# TuneD and tuned-ppd write logs under /var/log/tuned. Some deployments retain
# this directory with generic var_log_t, so create and relabel it before the
# services start.
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - - -
