[Service]
# Re-hide the managed system remote every time BlueBuild refreshes system
# Flatpak state, so we stay ordered after remote creation/re-enable.
ExecStartPost=-/usr/bin/bash -lc '/usr/bin/flatpak --system remotes --columns=name | /usr/bin/grep -qx org-system && /usr/bin/flatpak --system remote-modify --no-enumerate --no-use-for-deps org-system'
